version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilal-postgres
    environment:
      POSTGRES_USER: ilal
      POSTGRES_PASSWORD: ilaldev
      POSTGRES_DB: ilal_saas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ilal -d ilal_saas']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
